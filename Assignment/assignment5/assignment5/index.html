<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Blogger</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>

    <link rel="stylesheet" href="../../button.css">
    <link rel="stylesheet" href="../../../button.css">
    <script src="../../../button.js"></script>

    <script src="script.js"></script>
</head>

<body>

    <div class="blog-container">
        <h1 id="top"></h1>

        <div class="message-board">
            <div id="topic" class="message-box topic-box"></div>
            <div id="reply1" class="message-box reply-box"></div>
            <div id="reply2" class="message-box reply-box"></div>
        </div>

        <div class="input-section">
            <textarea name="message" id="message" placeholder="พิมพ์ข้อความของคุณที่นี่..."></textarea>
            <div class="button-group">
                <button type="button" id="post-btn" class="btn btn-primary">Post</button>
                <button type="button" id="clear-btn" class="btn btn-danger">Clear</button>
            </div>
        </div>
    </div>

</body>

</html>
